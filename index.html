<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord - Les Nouveaux Editeurs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1a2e;
            --paper: #faf9f7;
            --accent: #1325D9;
            --accent-hover: #0f1eb0;
            --muted: #6b6b7b;
            --border: #e8e6e3;
            --shadow: rgba(26, 26, 46, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            line-height: 1.6;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: 
                linear-gradient(135deg, transparent 25%, rgba(19, 37, 217, 0.03) 25%, rgba(19, 37, 217, 0.03) 50%, transparent 50%),
                var(--paper);
            background-size: 60px 60px;
        }

        .login-card {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 4px 24px var(--shadow), 0 1px 3px var(--shadow);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-logo {
            margin-bottom: 1rem;
        }

        .login-logo img {
            height: 60px;
            width: auto;
        }

        .login-title {
            font-family: 'Fraunces', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--ink);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            font-size: 1rem;
            font-family: inherit;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            background: var(--paper);
            color: var(--ink);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(19, 37, 217, 0.1);
        }

        .form-input::placeholder {
            color: var(--muted);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .login-btn:hover {
            background: var(--accent-hover);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .error-message {
            background: #fef2f2;
            color: #991b1b;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: none;
            border: 1px solid #fecaca;
        }

        .error-message.show {
            display: block;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .dashboard {
            display: none;
            min-height: 100vh;
            flex-direction: column;
        }

        .dashboard.active {
            display: flex;
        }

        .dashboard-header {
            background: white;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 1px 3px var(--shadow);
        }

        .dashboard-logo img {
            height: 40px;
            width: auto;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .logout-btn {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: inherit;
            background: transparent;
            color: var(--muted);
            border: 1.5px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .dashboard-content {
            flex: 1;
            padding: 1.5rem;
            background: var(--paper);
        }

        .report-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            height: calc(100vh - 140px);
        }

        .report-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .report-title {
            font-family: 'Fraunces', serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--ink);
        }

        .report-meta {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .powerbi-frame {
            width: 100%;
            height: calc(100% - 60px);
            border: none;
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 2rem;
            }

            .dashboard-header {
                padding: 1rem;
                flex-wrap: wrap;
                gap: 1rem;
            }

            .header-right {
                width: 100%;
                justify-content: space-between;
            }

            .dashboard-content {
                padding: 1rem;
            }

            .report-container {
                height: calc(100vh - 180px);
            }
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginPage">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <img src="logo.png" alt="Les Nouveaux Editeurs" onerror="this.style.display='none'">
                </div>
                <div class="login-title">Les Nouveaux Editeurs</div>
                <p class="login-subtitle">Accedez a vos tableaux de bord</p>
            </div>

            <div class="error-message" id="errorMessage">
                Identifiants incorrects. Veuillez reessayer.
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Identifiant</label>
                    <input type="text" id="username" class="form-input" placeholder="Entrez votre identifiant" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Mot de passe</label>
                    <input type="password" id="password" class="form-input" placeholder="Entrez votre mot de passe" required autocomplete="current-password">
                </div>

                <button type="submit" class="login-btn">Se connecter</button>
            </form>
        </div>
    </div>

    <div class="dashboard" id="dashboardPage">
        <header class="dashboard-header">
            <div class="dashboard-logo">
                <img src="logo.png" alt="Les Nouveaux Editeurs" onerror="this.style.display='none'">
            </div>
            <div class="header-right">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">L</div>
                    <span id="userName">LNE</span>
                </div>
                <button class="logout-btn" id="logoutBtn">Deconnexion</button>
            </div>
        </header>

        <main class="dashboard-content">
            <div class="report-container">
                <div class="report-header">
                    <span class="report-title">Rapport Power BI</span>
                    <span class="report-meta">Mise a jour automatique</span>
                </div>
                <iframe id="powerbiFrame" class="powerbi-frame" src="https://app.powerbi.com/view?r=eyJrIjoiMTJkYWJjOTQtYjQyNC00ZWY1LWIxOTktYmZlMDk0N2Q3ZDEyIiwidCI6IjVlZWQ5ZjM2LTQ5NDctNDNhMS1hOTVjLWU0YmNlNTVkMmM5MCJ9"></iframe>
            </div>
        </main>
    </div>

    <script>
        var VALID_USER = "lne";
        var VALID_HASH = "489fc18cb10d357b75d096901a2968f23322b3654f4c4a5c61980d7d68d9106d";

        function sha256(str) {
            var buffer = new TextEncoder().encode(str);
            return crypto.subtle.digest("SHA-256", buffer).then(function(hash) {
                var hexCodes = [];
                var view = new DataView(hash);
                for (var i = 0; i < view.byteLength; i += 1) {
                    var byte = view.getUint8(i).toString(16);
                    hexCodes.push(byte.length === 1 ? "0" + byte : byte);
                }
                return hexCodes.join("");
            });
        }

        var loginPage = document.getElementById("loginPage");
        var dashboardPage = document.getElementById("dashboardPage");
        var loginForm = document.getElementById("loginForm");
        var errorMessage = document.getElementById("errorMessage");
        var logoutBtn = document.getElementById("logoutBtn");

        function checkSession() {
            if (sessionStorage.getItem("lne_user")) {
                showDashboard();
            }
        }

        function showDashboard() {
            loginPage.style.display = "none";
            dashboardPage.classList.add("active");
        }

        function hideDashboard() {
            sessionStorage.removeItem("lne_user");
            loginPage.style.display = "flex";
            dashboardPage.classList.remove("active");
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
        }

        loginForm.addEventListener("submit", function(e) {
            e.preventDefault();
            var user = document.getElementById("username").value.toLowerCase().trim();
            var pass = document.getElementById("password").value;

            sha256(pass).then(function(hash) {
                if (user === VALID_USER && hash === VALID_HASH) {
                    sessionStorage.setItem("lne_user", "LNE");
                    errorMessage.classList.remove("show");
                    showDashboard();
                } else {
                    errorMessage.classList.add("show");
                }
            });
        });

        logoutBtn.addEventListener("click", hideDashboard);

        checkSession();
    </script>
</body>
</html>
